<svg viewBox="0 0 650 180" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="circleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Colorful circular segments -->
  <!-- Green segment (top-left) -->
  <circle cx="90" cy="90" r="55" fill="none" stroke="url(#circleGrad1)" stroke-width="20" stroke-dasharray="86 344" stroke-dashoffset="0"/>
  
  <!-- Yellow/Orange segment (top-right) -->
  <circle cx="90" cy="90" r="55" fill="none" stroke="url(#circleGrad2)" stroke-width="20" stroke-dasharray="86 344" stroke-dashoffset="-86"/>
  
  <!-- Pink segment (bottom-right) -->
  <circle cx="90" cy="90" r="55" fill="none" stroke="url(#circleGrad3)" stroke-width="20" stroke-dasharray="86 344" stroke-dashoffset="-172"/>
  
  <!-- Blue segment (bottom-left) -->
  <circle cx="90" cy="90" r="55" fill="none" stroke="url(#circleGrad4)" stroke-width="20" stroke-dasharray="86 344" stroke-dashoffset="-258"/>
  
  <!-- Center accent dot -->
  <circle cx="90" cy="65" r="8" fill="#ec4899" opacity="0.9"/>
  
  <!-- Text: Kovai.co -->
  <text x="240" y="125" font-family="Arial, sans-serif" font-size="80" font-weight="900" fill="#1f2937" letter-spacing="0.5">Kovai.co</text>
</svg>
